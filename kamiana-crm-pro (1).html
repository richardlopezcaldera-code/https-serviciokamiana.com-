<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kamiana SPA — CRM Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0f18;--bg2:#111827;--bg3:#1a2236;--bg4:#1f2d45;
  --border:#243352;--border2:#2e4068;
  --text:#f0f4ff;--text2:#8fa3c8;--text3:#4d6390;
  --blue:#3b82f6;--blue2:#2563eb;--blue-l:rgba(59,130,246,.12);
  --green:#22c55e;--green-l:rgba(34,197,94,.1);
  --amber:#f59e0b;--amber-l:rgba(245,158,11,.1);
  --red:#ef4444;--red-l:rgba(239,68,68,.1);
  --purple:#a855f7;--purple-l:rgba(168,85,247,.1);
  --cyan:#06b6d4;--cyan-l:rgba(6,182,212,.1);
  --gold:#d4a017;--gold-l:rgba(212,160,23,.12);
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--r2:12px;--r3:16px;--sidebar:252px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font);font-size:13px}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:36px 32px;width:100%;max-width:400px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center}
.login-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--blue),#1d4ed8);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.login-title{font-size:20px;font-weight:800;color:var(--text)}
.login-sub{font-size:11px;color:var(--text3);text-align:center;margin-bottom:24px}
.login-err{background:var(--red-l);border:1px solid rgba(239,68,68,.3);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--red);margin-bottom:14px;display:none}

/* SIDEBAR */
.sb{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),#1d4ed8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.sb-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.1}
.sb-sub{font-size:9.5px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase}
.sb-nav{flex:1;padding:8px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;padding:10px 8px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--text2);margin-bottom:1px;transition:all .12s}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--blue-l);color:var(--blue)}
.sb-item svg{width:16px;height:16px;flex-shrink:0}
.sb-item span{font-size:12.5px;font-weight:500}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:9px}
.sb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sb-role{font-size:9px;color:var(--text3);margin-top:1px}
.sb-logout{margin-left:auto;color:var(--text3);cursor:pointer;padding:4px}
.sb-logout:hover{color:var(--red)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:18px 20px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-success{background:var(--green-l);color:var(--green);border:1px solid rgba(34,197,94,.2)}.btn-success:hover{background:rgba(34,197,94,.18)}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.18)}
.btn-amber{background:var(--amber-l);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.btn-gold{background:var(--gold-l);color:var(--gold);border:1px solid rgba(212,160,23,.25)}.btn-gold:hover{background:rgba(212,160,23,.2)}
.btn-sm{padding:5px 9px;font-size:11px}
.btn-icon{padding:6px;border-radius:var(--r)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kpi-val{font-size:22px;font-weight:800;line-height:1;color:var(--text)}
.kpi-note{font-size:11px;color:var(--text3);margin-top:4px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-l);color:var(--green)}.bb{background:var(--blue-l);color:var(--blue)}.ba{background:var(--amber-l);color:var(--amber)}.br{background:var(--red-l);color:var(--red)}.bp{background:var(--purple-l);color:var(--purple)}.bc{background:var(--cyan-l);color:var(--cyan)}.bgr{background:var(--bg4);color:var(--text2)}.bgo{background:var(--gold-l);color:var(--gold)}

/* TABLE */
.tw{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.tw-hd{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);gap:8px}
.tw-hd h3{font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:9px 13px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
.tdm{color:var(--text)!important;font-weight:600}
.tdmono{font-family:var(--mono);font-size:11px;color:var(--text3)!important}
.tdamt{font-weight:700;color:var(--text)!important;font-size:13px}
.tdbl{color:var(--blue)!important;font-weight:600}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);width:100%;max-width:700px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-xl{max-width:960px}
.modal-sm{max-width:480px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;background:var(--bg2);z-index:1}
.mhd h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.mbd{padding:20px}
.mft{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;position:sticky;bottom:0;background:var(--bg2)}

/* FORM */
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.fl-req::after{content:' *';color:var(--red)}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;color:var(--text);font-size:12.5px;transition:border .12s;outline:none}
.fi:focus{border-color:var(--blue)}.fi::placeholder{color:var(--text3)}
select.fi option{background:var(--bg3);color:var(--text)}
textarea.fi{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* SEARCH */
.sbar{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 11px;min-width:230px}
.sbar svg{color:var(--text3);width:14px;height:14px;flex-shrink:0}
.sbar input{background:transparent;border:none;color:var(--text);font-size:12px;flex:1;outline:none;min-width:0}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:var(--r);width:fit-content}
.tab{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .12s;white-space:nowrap}
.tab.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* PIPELINE */
.pipe{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.pcol{min-width:200px;flex-shrink:0}
.pcol-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.pcol-hd span{font-size:11.5px;font-weight:700;color:var(--text2)}
.pcnt{background:var(--bg4);color:var(--text3);font-size:10px;padding:1px 6px;border-radius:99px;font-weight:700}
.deal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:11px;margin-bottom:7px;cursor:pointer;transition:all .12s}
.deal:hover{border-color:var(--border2);background:var(--bg3)}
.deal-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.deal-co{font-size:11px;color:var(--text3);margin-bottom:7px}
.deal-amt{font-size:14px;font-weight:700;color:var(--blue)}
.pbar{height:4px;background:var(--bg4);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar-fill{height:100%;border-radius:99px}

/* PROGRESS */
.prog-item{margin-bottom:10px}
.prog-lbl{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11.5px}
.prog-bar{height:5px;background:var(--bg4);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px}

/* MISC */
.sep{height:1px;background:var(--border);margin:14px 0}
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--text3);text-align:center;gap:8px}
.empty svg{width:36px;height:36px;opacity:.3}
.empty h3{font-size:14px;color:var(--text2);font-weight:600}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:8px;animation:tsl .2s ease;min-width:220px;pointer-events:all;border-left:3px solid var(--border2)}
.toast-ok{border-left-color:var(--green)}.toast-err{border-left-color:var(--red)}.toast-info{border-left-color:var(--blue)}
@keyframes tsl{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.cot-row{display:grid;grid-template-columns:1fr 70px 110px 110px 28px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.cot-total{background:var(--bg3);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.frow{padding:7px 10px;background:var(--bg3);border-radius:var(--r)}
.frow-k{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.frow-v{font-size:12.5px;color:var(--text);font-weight:500}
/* USER MODULE */
.role-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.role-admin{background:var(--gold-l);color:var(--gold)}
.role-gerente{background:var(--purple-l);color:var(--purple)}
.role-vendedor{background:var(--blue-l);color:var(--blue)}
.role-bodega{background:var(--cyan-l);color:var(--cyan)}
.role-lector{background:var(--bg4);color:var(--text2)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.perm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--r);font-size:12px}
.perm-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.perm-item label{cursor:pointer;color:var(--text2)}
.perm-item.checked label{color:var(--text);font-weight:500}
/* DROP ZONE */
.dropz{border:2px dashed var(--border2);border-radius:var(--r2);padding:22px;text-align:center;cursor:pointer;transition:all .15s}
.dropz:hover,.dropz.drag{border-color:var(--blue);background:rgba(59,130,246,.06)}
.dropz svg{width:26px;height:26px;color:var(--text3);margin:0 auto 8px;display:block}
/* PDF PREVIEW */
.pdf-badge{display:inline-flex;align-items:center;gap:6px;background:var(--red-l);border:1px solid rgba(239,68,68,.2);border-radius:var(--r);padding:5px 10px;font-size:12px;color:var(--red);font-weight:600}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div id="login-screen" style="display:none">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-mark">K</div>
      <div>
        <div style="font-size:20px;font-weight:800;color:var(--text)">Kamiana SPA</div>
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px">Sistema CRM · Acceso</div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:11px;color:var(--text3)">RUT: 77.727.836-3 · Venta de Muebles</div>
    </div>
    <div id="login-err" class="login-err">Usuario o contraseña incorrectos</div>
    <div class="fg"><label class="fl">Usuario</label><input class="fi" id="li-user" placeholder="usuario@kamiana.cl" autocomplete="username"/></div>
    <div class="fg"><label class="fl">Contraseña</label><input class="fi" type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn btn-primary" style="width:100%;margin-top:6px;justify-content:center;padding:10px" onclick="doLogin()">Ingresar al sistema</button>
    <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text3)">
      Demo: <strong style="color:var(--text2)">admin</strong> / <strong style="color:var(--text2)">kamiana2024</strong>
    </div>
  </div>
</div>
</div>

<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>

// PROTECTOR DE ACCESO (route/view guard)
// Un usuario solo puede ver un módulo si su rol lo permite.
// dashboard queda siempre disponible para cualquier sesión autenticada.
// Se aplica en dos capas: nav() (al navegar, con aviso) y re() (backstop
// silencioso en cada render, por si S.view llega a un módulo prohibido por
// cualquier otra vía). Defensa en profundidad.
// ═══════════════════════════════════════════════════════
function canView(v){return v==='dashboard'||hasPerm(v);}
function nav(v){if(!canView(v)){toast('Sin permiso para acceder a este módulo','err');return;}S.view=v;S.modal=null;S.search='';S.tab=0;S.filter='todos';re();}
function openM(n,d={}){S.modal={name:n,...d};re();}
function closeM(){S.modal=null;S.cotItems=[{desc:'',qty:1,precio:0}];S.editCotItems=[];re();}
function confirmDelete(msg,fn){if(confirm(msg))fn();}

function bEt(e){const m={contacto:'bgr',calificacion:'bb',propuesta:'ba',negociacion:'bp',cerrado:'bg'};const l={contacto:'Contacto',calificacion:'Calificación',propuesta:'Propuesta',negociacion:'Negociación',cerrado:'Cerrado'};return`<span class="badge ${m[e]||'bgr'}">${l[e]||e}</span>`;}
function bRol(r){const u=DB_USERS.find(x=>x.id===r)||{rol:'lector'};const role=ROLES[u.rol]||ROLES.lector;return`<span class="role-badge ${role.color}">${role.label}</span>`;}

function createPDF(){
  const {jsPDF}=window.jspdf;
  return new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
}

function drawHeader(doc,title,subtitle=''){
  // Franja superior azul
  doc.setFillColor(30,66,159);
  doc.rect(0,0,210,22,'F');

  // Nombre empresa
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.setTextColor(255,255,255);
  doc.text(EMP.nombre,14,10);

  // Giro
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(180,200,255);
  doc.text(`RUT: ${EMP.rut}  |  Giro: ${EMP.giro}`,14,16);

  // Título del doc
  doc.setFontSize(9);
  doc.setTextColor(180,200,255);
  doc.text(title, 210-14, 10, {align:'right'});
  if(subtitle)doc.text(subtitle,210-14,16,{align:'right'});

  // Sub-header blanco con info empresa
  doc.setFillColor(247,249,255);
  doc.rect(0,22,210,14,'F');
  doc.setDrawColor(220,228,245);
  doc.setLineWidth(0.3);
  doc.line(0,36,210,36);

  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(60,80,120);
  doc.text(`${EMP.direccion}  |  Tel: ${EMP.tel1} / ${EMP.tel2}  |  ${EMP.email}  |  ${EMP.web}`,14,29);
  doc.setFont('helvetica','bold');
  doc.setFontSize(7.5);
  doc.text(`Gerente General: ${EMP.gerenteGeneral}  |  Gerente de Ventas: ${EMP.gerenteVentas}`,14,34);

  return 42; // y start
}

function drawFooter(doc,pageNum,totalPages){
  const y=287;
  doc.setDrawColor(200,210,230);
  doc.setLineWidth(0.3);
  doc.line(14,y,196,y);
  doc.setFont('helvetica','normal');
  doc.setFontSize(7);
  doc.setTextColor(120,140,170);
  doc.text(`${EMP.nombre}  ·  RUT ${EMP.rut}  ·  ${EMP.giro}`,14,y+4);
  doc.text(`${EMP.web}  ·  ${EMP.email}`,14,y+8);
  doc.text(`Página ${pageNum} de ${totalPages}`,196,y+4,{align:'right'});
  // Firma
  doc.setFontSize(7);
  doc.text(`${EMP.gerenteGeneral}`,150,y+4);
  doc.text(`Gerente General`,150,y+8);
  doc.text(`${EMP.gerenteVentas}`,14,y+8);
}

// PDF COTIZACIÓN
function pdfCotizacion(cotId){
  const cot=DB.cotizaciones.find(c=>c.id===cotId);
  if(!cot){toast('Cotización no encontrada','err');return;}
  const cli=clGet(cot.clienteId);
  const neto=cot.items.reduce((s,i)=>s+(i.qty*i.precio),0);
  const iva=Math.round(neto*.19);
  const bruto=neto+iva;

  const doc=createPDF();
  let y=drawHeader(doc,`COTIZACIÓN FORMAL`,cot.id);

  // Bloque datos cotización + cliente
  doc.setFillColor(240,245,255);
  doc.rect(14,y,90,38,'F');
  doc.setDrawColor(200,215,240);
  doc.setLineWidth(0.3);
  doc.rect(14,y,90,38,'S');

  doc.setFillColor(240,245,255);
  doc.rect(108,y,88,38,'F');
  doc.rect(108,y,88,38,'S');

  // Proveedor
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(80,100,150);
  doc.text('PROVEEDOR',17,y+6);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,40,80);
  doc.text(EMP.nombre,17,y+12);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(60,80,120);
  doc.text(`RUT: ${EMP.rut}`,17,y+17);
  doc.text(EMP.direccion,17,y+21);
  doc.text(`${EMP.email}`,17,y+25);
  doc.text(`Tel: ${EMP.tel1} / ${EMP.tel2}`,17,y+29);
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);
  doc.text(EMP.gerenteVentas+' — '+EMP.cargo_rv,17,y+34);

  // Cliente
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(80,100,150);
  doc.text('CLIENTE',111,y+6);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,40,80);
  doc.text(cli.nombre.length>28?cli.nombre.slice(0,28)+'...':cli.nombre,111,y+12);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(60,80,120);
  doc.text(`RUT: ${cli.rut}`,111,y+17);
  doc.text(cli.contacto,111,y+21);
  doc.text(cli.ciudad+', '+cli.region,111,y+25);
  doc.text(cli.email,111,y+29);
  if(cot.plazo)doc.text(`Plazo: ${cot.plazo}`,111,y+34);

  y+=42;

  // Info cotización
  doc.setFillColor(30,66,159);
  doc.rect(14,y,182,8,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(255,255,255);
  doc.text(`N° ${cot.id}   ·   Ref: ${cot.refExt}   ·   Fecha: ${cot.fecha}   ·   Validez: ${cot.validez}   ·   ${cot.portal}`,17,y+5.5);
  y+=10;

  if(cot.ref){
    doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(60,80,130);
    doc.text(`Referencia: ${cot.ref}`,14,y+5);
    y+=9;
  }

  // Tabla items
  const rows=cot.items.map(i=>[i.id,i.desc.length>60?i.desc.slice(0,60)+'...':i.desc,i.qty,i.precio>0?fmt(i.precio):'—',i.qty*i.precio>0?fmt(i.qty*i.precio):'—']);
  doc.autoTable({
    startY:y,
    head:[['ID Línea','Descripción del Producto / Pack','Cant.','V. Unit. Neto','V. Total Neto']],
    body:rows,
    theme:'grid',
    headStyles:{fillColor:[30,66,159],textColor:255,fontStyle:'bold',fontSize:8},
    bodyStyles:{fontSize:8,textColor:[40,60,100]},
    columnStyles:{0:{cellWidth:30,fontStyle:'bold'},1:{cellWidth:82},2:{cellWidth:12,halign:'center'},3:{cellWidth:28,halign:'right'},4:{cellWidth:30,halign:'right',fontStyle:'bold'}},
    styles:{cellPadding:3,lineColor:[200,215,240],lineWidth:0.2},
    margin:{left:14,right:14},
  });
  y=doc.lastAutoTable.finalY+4;

  // Totales
  doc.setFillColor(247,249,255);
  doc.rect(120,y,76,24,'F');
  doc.setDrawColor(200,215,240);doc.setLineWidth(0.3);
  doc.rect(120,y,76,24,'S');

  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(80,100,150);
  doc.text('Valor Despacho (incluido):',122,y+6);
  doc.text('Valor Neto Consolidado:',122,y+11);
  doc.text('IVA (19%):',122,y+16);
  doc.setFont('helvetica','bold');
  doc.text('$0',192,y+6,{align:'right'});
  doc.text(fmt(neto),192,y+11,{align:'right'});
  doc.text(fmt(iva),192,y+16,{align:'right'});

  doc.setFillColor(30,66,159);
  doc.rect(120,y+18,76,10,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
  doc.text('MONTO TOTAL (c/IVA):',122,y+25);
  doc.setFontSize(11);
  doc.text(fmt(bruto),192,y+25,{align:'right'});
  y+=34;

  // Notas
  if(cot.notas){
    doc.setFont('helvetica','italic');doc.setFontSize(7.5);doc.setTextColor(80,100,140);
    const notaLines=doc.splitTextToSize(`Condiciones: ${cot.notas}`,182);
    doc.text(notaLines,14,y);
    y+=notaLines.length*4+3;
  }

  // Tags
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(30,100,60);
  const tags=[];
  if(cot.garantia)tags.push(`Garantía: ${cot.garantia}`);
  if(cot.armado)tags.push('Incluye armado');
  if(tags.length)doc.text(tags.join('   |   '),14,y);

  // Firma
  y+=16;
  if(y>255)y=255;
  doc.setDrawColor(180,200,230);doc.setLineWidth(0.4);
  doc.line(14,y+14,80,y+14);
  doc.line(130,y+14,196,y+14);
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(60,80,120);
  doc.text(EMP.gerenteGeneral,47,y+18,{align:'center'});
  doc.text(EMP.cargo_gg,47,y+22,{align:'center'});
  doc.text(EMP.gerenteVentas,163,y+18,{align:'center'});
  doc.text(EMP.cargo_rv,163,y+22,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(100,120,150);
  doc.text(`RUT: ${EMP.rut}  |  Giro: ${EMP.giro}`,105,y+22,{align:'center'});

  drawFooter(doc,1,1);
  doc.save(`${cot.id}_${cli.nombre.replace(/[^a-zA-Z0-9]/g,'_')}.pdf`);
  toast(`PDF generado: ${cot.id}`,'ok');
}

        <div style="width:30px;height:30px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${i+1}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">${r.nombre}</div><div style="font-size:11px;color:var(--text3)">${r.vendedor} · ${r.zona} · ${r.kms} km · ${r.dia}</div></div>
        <span class="badge ${r.estado==='activa'?'bg':'bgr'}">${r.estado==='activa'?'Activa':'Inactiva'}</span>
        <span class="badge bb">${r.clientes.length} clientes</span>
        ${hasPerm('eliminar')?`<button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();eliminarRuta('${r.id}')">${I.trash}</button>`:''}
      </div>
    </div>`).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// MÓDULO USUARIOS

function vUsuarios(){
  if(!hasPerm('usuarios')){return`<div class="empty">${I.lock}<h3>Acceso restringido</h3><p>Solo administradores pueden gestionar usuarios.</p></div>`;}
  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div class="sbar">${I.search}<input placeholder="Buscar usuario..." value="${S.search}" oninput="S.search=this.value;re()"/></div>
    <button class="btn btn-primary" onclick="openM('nuevoUsuario')">${I.plus} Nuevo Usuario</button>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Avatar</th><th>Nombre completo</th><th>Usuario</th><th>Email</th><th>Cargo</th><th>Rol / Nivel</th><th>Estado</th><th>Módulos con acceso</th><th>Acciones</th></tr></thead>
    <tbody>${DB_USERS.filter(u=>u.nombre.toLowerCase().includes(S.search)||u.email.includes(S.search)||u.usuario.includes(S.search)).map(u=>{
      const role=ROLES[u.rol]||ROLES.lector;
      const perms=u.perms.includes('all')?'Acceso total (administrador)':u.perms.slice(0,4).join(', ')+(u.perms.length>4?` +${u.perms.length-4} más`:'');
      return`<tr>
        <td><div style="width:30px;height:30px;border-radius:50%;background:${u.avColor}22;color:${u.avColor};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${u.avatar}</div></td>
        <td class="tdm">${u.nombre}</td>
        <td class="tdmono">${u.usuario}</td>
        <td style="font-size:11px;color:var(--blue)">${u.email}</td>
        <td style="font-size:11px">${u.cargo}</td>
        <td><span class="role-badge ${role.color}">${role.label}</span></td>
        <td><span class="badge ${u.activo?'bg':'br'}">${u.activo?'Activo':'Inactivo'}</span></td>
        <td style="font-size:10px;color:var(--text3);max-width:160px">${perms}</td>
        <td><div style="display:flex;gap:3px">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="openM('editUsuario',{uId:'${u.id}'})">${I.edit}</button>
          ${u.id!==currentUser?.id?`<button class="btn btn-ghost btn-sm btn-icon" onclick="toggleUsuario('${u.id}')">${u.activo?I.lock:I.check}</button>`:''}
          ${u.id!==currentUser?.id?`<button class="btn btn-danger btn-sm btn-icon" onclick="eliminarUsuario('${u.id}')">${I.trash}</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  <div style="margin-top:16px" class="card">
    <div style="font-size:12px;font-weight:700;margin-bottom:12px;color:var(--text)">Roles y permisos por nivel</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
      ${Object.entries(ROLES).map(([k,r])=>`<div style="background:var(--bg3);border-radius:var(--r);padding:10px">
        <div class="role-badge ${r.color}" style="margin-bottom:8px;display:inline-flex">${r.label}</div>
        <div style="font-size:10.5px;color:var(--text2)">${r.perms.includes('all')?'Acceso total al sistema':r.perms.slice(0,5).map(p=>{const pm=ALL_PERMS.find(x=>x.k===p);return pm?pm.l:p;}).join(', ')}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// MODALS

          <div style="font-size:11px;color:var(--text2)">RUT: ${EMP.rut} · ${EMP.giro}</div>
          <div style="font-size:11px;color:var(--text2)">${EMP.direccion}</div>
          <div style="font-size:11px;color:var(--text2)">${EMP.email} · ${EMP.tel1}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:3px"><strong>${EMP.gerenteVentas}</strong> — ${EMP.cargo_rv}</div>
        </div>
        <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">CLIENTE</div>
          <div style="font-size:13px;font-weight:700;color:var(--text)">${cli.nombre}</div>
          <div style="font-size:11px;color:var(--text2)">RUT: ${cli.rut}</div>
          <div style="font-size:11px;color:var(--text2)">${cli.contacto} · ${cli.ciudad}</div>
          <div style="font-size:11px;color:var(--text2)">${cli.email}</div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--border);padding-top:10px">

        <div><div style="font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase">Fecha</div><div style="font-size:12px;font-weight:600;color:var(--text);margin-top:2px">${cot.fecha}</div></div>
        <div><div style="font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase">Validez</div><div style="font-size:12px;font-weight:600;color:var(--text);margin-top:2px">${cot.validez}</div></div>
        <div><div style="font-size:9.5px;color:var(--text3);font-weight:700;text-transform:uppercase">Portal</div><div class="badge bc" style="margin-top:2px">${cot.portal}</div></div>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:12px">
      <thead><tr style="background:var(--bg3)">
        <th style="padding:8px;font-size:10px;color:var(--text3);font-weight:700;text-align:left;border-bottom:1px solid var(--border)">ID Línea</th>
        <th style="padding:8px;font-size:10px;color:var(--text3);font-weight:700;text-align:left;border-bottom:1px solid var(--border)">Descripción</th>

        <th style="padding:8px;font-size:10px;color:var(--text3);font-weight:700;text-align:right;border-bottom:1px solid var(--border)">V. Total Neto</th>
      </tr></thead>
      <tbody>${cot.items.map(i=>`<tr>
        <td style="padding:8px;font-family:var(--mono);font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">${i.id}</td>
        <td style="padding:8px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)">${i.desc}</td>

        <td style="padding:8px;text-align:right;font-weight:700;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)">${i.qty*i.precio>0?fmt(i.qty*i.precio):'—'}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div style="background:var(--bg3);border-radius:var(--r);padding:12px">
      <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span style="color:var(--text2)">Valor Despacho:</span><span style="color:var(--green);font-weight:600">$0 (incluido)</span></div>
      <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-top:1px solid var(--border);margin-top:5px"><span style="color:var(--text2)">Valor Neto:</span><span style="font-weight:700">${fmt(neto)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span style="color:var(--text2)">IVA (19%):</span><span>${fmt(iva)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:7px 0 0;border-top:1px solid var(--border);margin-top:5px"><span style="font-size:14px;font-weight:700">TOTAL OFERTADO (c/IVA)</span><span style="font-size:18px;font-weight:800;color:var(--blue)">${fmt(bruto)}</span></div>
    </div>
    ${cot.notas?`<div style="margin-top:10px;background:var(--bg3);border-left:3px solid var(--blue);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;font-size:11.5px;color:var(--text2)">${cot.notas}</div>`:''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">

      <div style="text-align:center"><div style="border-top:1px solid var(--border);padding-top:8px;margin-top:30px"><div style="font-size:12px;font-weight:700;color:var(--text)">${EMP.gerenteGeneral}</div><div style="font-size:10px;color:var(--text3)">${EMP.cargo_gg} · ${EMP.nombre}</div><div style="font-size:10px;color:var(--text3)">RUT: ${EMP.rut}</div></div></div>
      <div style="text-align:center"><div style="border-top:1px solid var(--border);padding-top:8px;margin-top:30px"><div style="font-size:12px;font-weight:700;color:var(--text)">${EMP.gerenteVentas}</div><div style="font-size:10px;color:var(--text3)">${EMP.cargo_rv} · ${EMP.nombre}</div></div></div>
    </div>`;
    foot=`<button class="btn btn-ghost" onclick="closeM()">Cerrar</button>${hasPerm('exportar')?`<button class="btn btn-gold" onclick="pdfCotizacion('${cot.id}')">${I.pdf} Generar PDF</button>`:''}`;
  }

  else if(m.name==='verFicha'){
    const ft=DB.fichas.find(f=>f.id===m.ftId);if(!ft)return'';
    const pv=pvGet(ft.prov);const pr=ppGet(ft.prod);
    xl=true;title=`${I.clip} ${ft.nombre}`;
    body=`
    <div style="background:var(--bg3);border-radius:var(--r);padding:12px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:3px">PROVEEDOR</div><div style="font-size:13px;font-weight:700;color:var(--text)">${pv.nombre}</div><div style="font-size:11px;color:var(--text2)">${pv.email} · ${pv.tel}</div></div>
      <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:3px">PRODUCTO</div><div style="font-size:13px;font-weight:700;color:var(--blue)">${pr?pr.nombre:'—'}</div><div style="font-size:11px;color:var(--text2)">SKU: ${pr?pr.sku:'—'} · Marca: ${pr?pr.marca:'—'}</div></div>
    </div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.7;margin-bottom:14px;background:var(--bg3);border-radius:var(--r);padding:12px">${ft.desc}</div>
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Especificaciones técnicas</div>
    <div class="ficha-grid">${Object.entries(ft.specs).map(([k,v])=>`<div class="frow"><div class="frow-k">${k.charAt(0).toUpperCase()+k.slice(1)}</div><div class="frow-v">${v}</div></div>`).join('')}</div>
    <div style="margin-top:12px"><span class="pdf-badge">${I.pdf} ${ft.archivo}</span><span style="font-size:11px;color:var(--text3);margin-left:10px">Cargado: ${ft.fecha}</span></div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="text-align:center"><div style="border-top:1px solid var(--border);padding-top:8px;margin-top:28px"><div style="font-size:12px;font-weight:700;color:var(--text)">${EMP.gerenteGeneral}</div><div style="font-size:10px;color:var(--text3)">${EMP.cargo_gg} · ${EMP.nombre}</div></div></div>
      <div style="text-align:center"><div style="border-top:1px solid var(--border);padding-top:8px;margin-top:28px"><div style="font-size:12px;font-weight:700;color:var(--text)">${EMP.gerenteVentas}</div><div style="font-size:10px;color:var(--text3)">${EMP.cargo_rv}</div></div></div>
    </div>`;
    foot=`<button class="btn btn-ghost" onclick="closeM()">Cerrar</button>${hasPerm('exportar')?`<button class="btn btn-gold" onclick="pdfFicha('${ft.id}')">${I.pdf} Generar PDF</button>`:''}`;
  }

  else if(m.name==='nuevoUsuario'||m.name==='editUsuario'){
    const eu=m.name==='editUsuario'?DB_USERS.find(u=>u.id===m.uId):null;
    const currentPerms=eu?eu.perms:[];
    sm=false;title=eu?`${I.edit} Editar Usuario: ${eu.nombre}`:`${I.shield} Nuevo Usuario`;
    body=`
    <div class="fgrid">
      <div class="fg"><label class="fl fl-req">Nombre completo</label><input class="fi" id="u-nombre" value="${eu?eu.nombre:''}" placeholder="Nombre Apellido"/></div>
      <div class="fg"><label class="fl">Cargo</label><input class="fi" id="u-cargo" value="${eu?eu.cargo:''}" placeholder="Gerente de Ventas"/></div>
    </div>
    <div class="fgrid">
      <div class="fg"><label class="fl fl-req">Usuario</label><input class="fi" id="u-user" value="${eu?eu.usuario:''}" placeholder="usuario.apellido"/></div>
      <div class="fg"><label class="fl fl-req">Email</label><input class="fi" type="email" id="u-email" value="${eu?eu.email:''}" placeholder="email@kamiana.cl"/></div>
    </div>
    <div class="fgrid">
      <div class="fg"><label class="fl ${eu?'':'fl-req'}">Contraseña ${eu?'(dejar vacío = no cambiar)':''}</label><input class="fi" type="password" id="u-pass" placeholder="••••••••"/></div>
      <div class="fg"><label class="fl">Rol predefinido</label>
        <select class="fi" id="u-rol" onchange="setRolPerms(this.value)">
          ${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${eu&&eu.rol===k?'selected':''}>${r.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px">Permisos de módulo (personalizable)</div>
      <div class="perm-grid" id="perms-grid">
        ${ALL_PERMS.map(p=>{
          const checked=currentPerms.includes('all')||currentPerms.includes(p.k);
          return`<div class="perm-item ${checked?'checked':''}" id="perm-wrap-${p.k}">
            <input type="checkbox" id="perm-${p.k}" ${checked?'checked':''} onchange="document.getElementById('perm-wrap-${p.k}').classList.toggle('checked',this.checked)"/>
            <label for="perm-${p.k}">${p.l}</label>
          </div>`;
        }).join('')}
      </div>
    </div>`;
    foot=`<button class="btn btn-ghost" onclick="closeM()">Cancelar</button><button class="btn btn-primary" onclick="guardarUsuario('${eu?eu.id:''}')">${I.check} ${eu?'Actualizar':'Crear Usuario'}</button>`;
  }

  else if(m.name==='nuevaCot'||m.name==='editCot'){
    const ec=m.name==='editCot'?DB.cotizaciones.find(c=>c.id===m.cotId):null;
    if(ec&&S.editCotItems.length===0)S.editCotItems=[...ec.items.map(i=>({...i}))];
    const items=ec?S.editCotItems:S.cotItems;
    xl=true;title=ec?`${I.edit} Editar ${ec.id}`:`${I.file} Nueva Cotización`;
    body=`
    <div class="fgrid">
      <div class="fg"><label class="fl fl-req">Cliente</label><select class="fi" id="nc-cli">${DB.clientes.map(c=>`<option value="${c.id}" ${(m.cId===c.id||(ec&&ec.clienteId===c.id))?'selected':''}>${c.nombre}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Ref. Externa</label><input class="fi" id="nc-ref" value="${ec?ec.refExt:''}" placeholder="Ej: 2281-966-COT26"/></div>

      <div class="fg"><label class="fl">Portal</label><select class="fi" id="nc-portal"><option ${ec?.portal==='Mercado Público'?'selected':''}>Mercado Público</option><option ${ec?.portal==='Privado'?'selected':''}>Privado</option><option>Licitación</option><option>Compra Ágil</option></select></div>
    </div>
    <div class="fgrid">
      <div class="fg"><label class="fl">Referencia / Proceso</label><input class="fi" id="nc-ref2" value="${ec?ec.ref:''}" placeholder="Adquisición enseres campamento"/></div>

    </div>
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 8px">Ítems / Líneas</div>
    <div id="items-wrap">
      ${items.map((it,idx)=>{const isEdit=!!ec;return`<div class="cot-row">
        <input class="fi" placeholder="Descripción" value="${it.desc}" oninput="${isEdit?'S.editCotItems':'S.cotItems'}[${idx}].desc=this.value"/>
        <input class="fi" type="number" placeholder="Cant." value="${it.qty}" min="0" oninput="${isEdit?'S.editCotItems':'S.cotItems'}[${idx}].qty=parseInt(this.value)||0;re()"/>
        <input class="fi" type="number" placeholder="Precio neto" value="${it.precio}" oninput="${isEdit?'S.editCotItems':'S.cotItems'}[${idx}].precio=parseInt(this.value)||0;re()"/>
        <div style="font-size:12px;font-weight:700;color:var(--blue)">${fmt(it.qty*it.precio)}</div>
        <button style="color:var(--red);padding:4px;cursor:pointer;background:none" onclick="${isEdit?'S.editCotItems':'S.cotItems'}.splice(${idx},1);re()">${I.x}</button>
      </div>`;}).join('')}
    </div>
    <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="${ec?'S.editCotItems':'S.cotItems'}.push({id:'L'+(Date.now()),desc:'',qty:1,precio:0});re()">${I.plus} Agregar ítem</button>
    <div class="cot-total">
      <div><span style="font-size:12px;color:var(--text2)">Neto: <strong style="color:var(--text)">${fmt(items.reduce((s,i)=>s+(i.qty*i.precio),0))}</strong></span><span style="margin-left:10px;font-size:12px;color:var(--text2)">IVA: <strong>${fmt(items.reduce((s,i)=>s+(i.qty*i.precio),0)*.19)}</strong></span></div>
      <div style="font-size:16px;font-weight:800;color:var(--blue)">${fmt(items.reduce((s,i)=>s+(i.qty*i.precio),0)*1.19)}</div>
    </div>
    <div class="fg" style="margin-top:12px"><label class="fl">Notas y condiciones</label><textarea class="fi" id="nc-notas" rows="2">${ec?ec.notas:''}</textarea></div>`;
    foot=`<button class="btn btn-ghost" onclick="closeM()">Cancelar</button><button class="btn btn-primary" onclick="guardarCot('${ec?ec.id:''}')">${I.check} ${ec?'Guardar cambios':'Crear Cotización'}</button>`;
  }

  else if(m.name==='editPedido'){
    const ped=DB.pedidos.find(p=>p.id===m.pedId);if(!ped)return'';

function guardarCot(editId){
  const cliId=document.getElementById('nc-cli')?.value;
  const fecha=document.getElementById('nc-fecha')?.value;
  if(!cliId||!fecha){toast('Completa cliente y fecha','err');return;}
  const items=editId?S.editCotItems:S.cotItems;
  const obj={clienteId:cliId,refExt:document.getElementById('nc-ref')?.value||'',fecha,validez:document.getElementById('nc-validez')?.value||'',estado:editId?(DB.cotizaciones.find(c=>c.id===editId)?.estado||'borrador'):'borrador',portal:document.getElementById('nc-portal')?.value||'Privado',tipo:'',ref:document.getElementById('nc-ref2')?.value||'',plazo:document.getElementById('nc-plazo')?.value||'',garantia:'6 meses',armado:false,notas:document.getElementById('nc-notas')?.value||'',items:[...items]};
  if(editId){Object.assign(DB.cotizaciones.find(c=>c.id===editId),obj);toast(`Cotización ${editId} actualizada`,'ok');}
  else{const id=`COT-2026-${String(_cotN++).padStart(4,'0')}`;DB.cotizaciones.push({id,...obj});toast(`Cotización ${id} creada`,'ok');}
  closeM();nav('cotizaciones');
}
function guardarCliente(editId){
  const nombre=document.getElementById('cli-n')?.value;
  if(!nombre){toast('Nombre requerido','err');return;}
  const obj={nombre,rut:document.getElementById('cli-r')?.value||'—',tipo:document.getElementById('cli-t')?.value||'Empresa',portal:document.getElementById('cli-p')?.value||'Privado',contacto:document.getElementById('cli-c')?.value||'—',email:document.getElementById('cli-e')?.value||'—',ciudad:document.getElementById('cli-ci')?.value||'—',region:document.getElementById('cli-rg')?.value||'—',notas:document.getElementById('cli-no')?.value||'',estado:'activo'};
  if(editId){Object.assign(DB.clientes.find(c=>c.id===editId),obj);toast(`Cliente actualizado`,'ok');}
  else{DB.clientes.push({id:`C${String(DB.clientes.length+1).padStart(3,'0')}`, ...obj});toast(`Cliente "${nombre}" registrado`,'ok');}
  closeM();nav('clientes');
}
function guardarProducto(editId){
  const n=document.getElementById('pp-n')?.value;const s=document.getElementById('pp-s')?.value;
  if(!n||!s){toast('Nombre y SKU requeridos','err');return;}
  const obj={nombre:n,sku:s,cat:document.getElementById('pp-c')?.value||'General',subcat:document.getElementById('pp-sc')?.value||'',marca:document.getElementById('pp-m')?.value||'—',precio:parseInt(document.getElementById('pp-pr')?.value)||0,costo:parseInt(document.getElementById('pp-co')?.value)||0,stock:parseInt(document.getElementById('pp-st')?.value)||0,stockMin:5,unidad:document.getElementById('pp-u')?.value||'Unidad',prov:document.getElementById('pp-pv')?.value||'PV001',desc:document.getElementById('pp-d')?.value||'',specs:{}};
  if(editId){const ep=ppGet(editId);if(ep){Object.assign(ep,obj);}toast(`Producto actualizado`,'ok');}
  else{DB.productos.push({id:`P${String(Date.now()).slice(-5)}`,...obj});toast(`Producto "${n}" creado`,'ok');}
  closeM();nav('productos');
}
function guardarProveedor(editId){
  const n=document.getElementById('pv-n')?.value;if(!n){toast('Nombre requerido','err');return;}
  const obj={nombre:n,cat:document.getElementById('pv-c')?.value||'General',contacto:document.getElementById('pv-co')?.value||'—',email:document.getElementById('pv-e')?.value||'—',tel:document.getElementById('pv-t')?.value||'—',pais:document.getElementById('pv-pa')?.value||'Chile',notas:document.getElementById('pv-no')?.value||'',estado:'activo'};
  if(editId){Object.assign(DB.proveedores.find(p=>p.id===editId),obj);toast(`Proveedor actualizado`,'ok');}
  else{DB.proveedores.push({id:`PV${String(DB.proveedores.length+1).padStart(2,'0')}`,...obj});toast(`Proveedor "${n}" registrado`,'ok');}
  closeM();nav('proveedores');
}
function guardarFicha(){
  const n=document.getElementById('ft-n')?.value;if(!n){toast('Nombre requerido','err');return;}
  const specs={};
  ['1','2','3'].forEach(i=>{const k=document.getElementById(`fk${i}`)?.value;const v=document.getElementById(`fv${i}`)?.value;if(k&&v)specs[k]=v;});
  const fname=document.getElementById('ft-fname')?.textContent||'archivo_adjunto';
  DB.fichas.push({id:`FT${String(Date.now()).slice(-5)}`,nombre:n,prov:document.getElementById('ft-pv')?.value||'PV001',prod:document.getElementById('ft-pr')?.value||'',fecha:today(),archivo:fname||'adjunto.pdf',desc:document.getElementById('ft-d')?.value||'',specs});
  toast(`Ficha "${n}" cargada`,'ok');closeM();nav('fichas');
}
function guardarUsuario(editId){
  const nom=document.getElementById('u-nombre')?.value;const us=document.getElementById('u-user')?.value;const em=document.getElementById('u-email')?.value;
  if(!nom||!us||!em){toast('Nombre, usuario y email requeridos','err');return;}
  const newPass=document.getElementById('u-pass')?.value;
  const rol=document.getElementById('u-rol')?.value||'vendedor';
  const perms=ALL_PERMS.filter(p=>document.getElementById(`perm-${p.k}`)?.checked).map(p=>p.k);
  const finalPerms=rol==='admin'?['all']:perms;
  if(editId){
    const eu=DB_USERS.find(u=>u.id===editId);
    if(eu){Object.assign(eu,{nombre:nom,usuario:us,email:em,cargo:document.getElementById('u-cargo')?.value||'',rol,perms:finalPerms});if(newPass)eu.pass=newPass;}
    toast(`Usuario ${nom} actualizado`,'ok');
  } else {
    const id=`U${String(_nextUserId++).padStart(3,'0')}`;
    if(!newPass){toast('La contraseña es requerida para nuevos usuarios','err');return;}
    DB_USERS.push({id,nombre:nom,email:em,usuario:us,pass:newPass,rol,perms:finalPerms,cargo:document.getElementById('u-cargo')?.value||'',activo:true,avatar:ini(nom),avColor:ac(nom),creado:today()});
    toast(`Usuario "${nom}" creado`,'ok');
  }
  closeM();nav('usuarios');
}
function setRolPerms(rol){
  const r=ROLES[rol];if(!r)return;
  ALL_PERMS.forEach(p=>{const el=document.getElementById(`perm-${p.k}`);const wrap=document.getElementById(`perm-wrap-${p.k}`);if(el){const on=r.perms.includes('all')||r.perms.includes(p.k);el.checked=on;if(wrap)wrap.classList.toggle('checked',on);}});
}
function guardarOpp(){
  const n=document.getElementById('op-n')?.value;if(!n){toast('Nombre requerido','err');return;}
  DB.oportunidades.push({id:`OPP-${String(DB.oportunidades.length+1).padStart(3,'0')}`,nombre:n,clienteId:document.getElementById('op-c')?.value,valor:parseInt(document.getElementById('op-v')?.value)||0,prob:parseInt(document.getElementById('op-p')?.value)||50,etapa:document.getElementById('op-e')?.value||'contacto',fecha:document.getElementById('op-f')?.value||'—',notas:''});
  toast(`Oportunidad creada`,'ok');closeM();nav('ventas');
}
function guardarPedido(){
  const cliId=document.getElementById('np-c')?.value;const fecha=document.getElementById('np-f')?.value;
  if(!cliId||!fecha){toast('Cliente y fecha requeridos','err');return;}
  const id=`PED-${String(_pedN++).padStart(3,'0')}`;
  DB.pedidos.push({id,clienteId:cliId,cotRef:document.getElementById('np-cr')?.value||'',fecha,estado:'pendiente',total:parseInt(document.getElementById('np-t')?.value)||0,ruta:document.getElementById('np-r')?.value||'R-01',notas:document.getElementById('np-n')?.value||''});
  toast(`Orden ${id} creada`,'ok');closeM();nav('pedidos');
}
function guardarEditPed(id){
  const p=DB.pedidos.find(x=>x.id===id);if(!p)return;
  p.clienteId=document.getElementById('ep-cli')?.value||p.clienteId;
  p.fecha=document.getElementById('ep-fecha')?.value||p.fecha;
  p.estado=document.getElementById('ep-estado')?.value||p.estado;
  p.notas=document.getElementById('ep-notas')?.value||'';
  toast(`Pedido ${id} actualizado`,'ok');closeM();nav('pedidos');
}
function guardarCobro(){
  const cliId=document.getElementById('cb-c')?.value;const monto=parseInt(document.getElementById('cb-m')?.value)||0;const venc=document.getElementById('cb-v')?.value;
  if(!monto||!venc){toast('Monto y vencimiento requeridos','err');return;}
  const id=`COB-${String(_cobN++).padStart(3,'0')}`;
  DB.cobranzas.push({id,clienteId:cliId,monto,vencimiento:venc,estado:'pendiente'});
  toast(`Cobro ${id} registrado`,'ok');closeM();nav('cobranza');
}
function guardarRuta(){
  const n=document.getElementById('rt-n')?.value;if(!n){toast('Nombre requerido','err');return;}
  DB.rutas.push({id:`R-${String(DB.rutas.length+1).padStart(2,'0')}`,nombre:n,vendedor:document.getElementById('rt-v')?.value||'Richard López',zona:document.getElementById('rt-z')?.value||'—',clientes:[],estado:'activa',kms:parseInt(document.getElementById('rt-k')?.value)||0,dia:document.getElementById('rt-d')?.value||'—'});
  toast(`Ruta "${n}" creada`,'ok');closeM();nav('rutas');
}
function handleFile(inp){if(inp.files[0]){const el=document.getElementById('ft-fname');if(el){el.textContent=inp.files[0].name;el.style.display='block';}toast(`"${inp.files[0].name}" listo`,'info');}}
// DELETE FUNCTIONS
function eliminarCot(id){confirmDelete(`¿Eliminar cotización ${id}? Esta acción es irreversible.`,()=>{DB.cotizaciones=DB.cotizaciones.filter(c=>c.id!==id);toast(`Cotización ${id} eliminada`,'info');re();});}
function eliminarPed(id){confirmDelete(`¿Eliminar pedido ${id}?`,()=>{DB.pedidos=DB.pedidos.filter(p=>p.id!==id);toast(`Pedido ${id} eliminado`,'info');re();});}
function eliminarCliente(id){if(DB.cotizaciones.some(c=>c.clienteId===id)){toast('No se puede eliminar: tiene cotizaciones asociadas','err');return;}confirmDelete(`¿Eliminar cliente?`,()=>{DB.clientes=DB.clientes.filter(c=>c.id!==id);toast(`Cliente eliminado`,'info');re();});}
function eliminarProducto(id){confirmDelete(`¿Eliminar producto?`,()=>{DB.productos=DB.productos.filter(p=>p.id!==id);toast(`Producto eliminado`,'info');re();});}
function eliminarProveedor(id){confirmDelete(`¿Eliminar proveedor?`,()=>{DB.proveedores=DB.proveedores.filter(p=>p.id!==id);toast(`Proveedor eliminado`,'info');re();});}
function eliminarFicha(id){confirmDelete(`¿Eliminar ficha técnica?`,()=>{DB.fichas=DB.fichas.filter(f=>f.id!==id);toast(`Ficha eliminada`,'info');re();});}
function eliminarRuta(id){confirmDelete(`¿Eliminar ruta?`,()=>{DB.rutas=DB.rutas.filter(r=>r.id!==id);toast(`Ruta eliminada`,'info');re();});}
function eliminarUsuario(id){if(id===currentUser?.id){toast('No puedes eliminarte a ti mismo','err');return;}confirmDelete(`¿Eliminar usuario?`,()=>{DB_USERS=DB_USERS.filter(u=>u.id!==id);toast(`Usuario eliminado`,'info');re();});}
function toggleUsuario(id){const u=DB_USERS.find(x=>x.id===id);if(u){u.activo=!u.activo;toast(`Usuario ${u.activo?'activado':'desactivado'}`,'info');re();}}
// QUICK ACTIONS
function aprobarCot(id){const c=DB.cotizaciones.find(x=>x.id===id);if(c){c.estado='aprobada';toast(`${id} aprobada`,'ok');re();}}
function cotToPed(cotId){const cot=DB.cotizaciones.find(c=>c.id===cotId);if(!cot)return;const n=cot.items.reduce((s,i)=>s+(i.qty*i.precio),0);const id=`PED-${String(_pedN++).padStart(3,'0')}`;DB.pedidos.push({id,cotRef:cotId,clienteId:cot.clienteId,fecha:today(),estado:'pendiente',total:Math.round(n*1.19),ruta:'R-01',notas:`Generado desde ${cotId}`});toast(`Pedido ${id} creado`,'ok');nav('pedidos');}
function chgPed(id,st){const p=DB.pedidos.find(x=>x.id===id);if(p){p.estado=st;toast(`Pedido ${id} → ${st}`,'ok');re();}}
function cobrar(id){const c=DB.cobranzas.find(x=>x.id===id);if(c){c.estado='pagado';toast(`Cobro ${id} pagado`,'ok');re();}}
function exportCotCSV(){let csv='"N° Cot.","Ref. Ext.","Cliente","Fecha","Neto","IVA","Total Bruto","Estado"\n';DB.cotizaciones.forEach(c=>{const n=c.items.reduce((s,i)=>s+(i.qty*i.precio),0);const iva=Math.round(n*.19);csv+=`"${c.id}","${c.refExt}","${clGet(c.clienteId).nombre}","${c.fecha}","${n}","${iva}","${n+iva}","${c.estado}"\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Kamiana_Cotizaciones.csv';a.click();toast('CSV cotizaciones exportado','ok');}
function exportProductosCSV(){let csv='"SKU","Nombre","Marca","Categoría","Precio Neto","Costo","Stock","Proveedor"\n';DB.productos.forEach(p=>{csv+=`"${p.sku}","${p.nombre}","${p.marca}","${p.cat}","${p.precio}","${p.costo}","${p.stock}","${pvGet(p.prov).nombre}"\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Kamiana_Catalogo.csv';a.click();toast('CSV catálogo exportado','ok');}

// RENDER

const viewMeta={
  dashboard:{h:'Dashboard',s:'Resumen operacional — Kamiana SPA'},
  clientes:{h:'Clientes',s:`${DB.clientes.length} registrados`},
  ventas:{h:'Pipeline de Ventas',s:'Oportunidades y seguimiento'},
  pedidos:{h:'Órdenes de Pedido',s:'Control de despacho'},
  cobranza:{h:'Cobranza',s:'Gestión de cobros'},
  cotizaciones:{h:'Cotizaciones',s:'Emisión y seguimiento — con PDF oficial'},
  productos:{h:'Catálogo de Productos',s:`${DB.productos.length} SKUs registrados`},
  proveedores:{h:'Proveedores',s:`${DB.proveedores.length} proveedores activos`},
  fichas:{h:'Fichas Técnicas',s:'Documentación oficial con PDF'},
  rutas:{h:'Rutas de Distribución',s:'Cobertura territorial'},
  usuarios:{h:'Usuarios & Permisos',s:'Control de acceso al sistema'},
};
const viewFns={dashboard:vDashboard,clientes:vClientes,ventas:vVentas,pedidos:vPedidos,cobranza:vCobranza,cotizaciones:vCotizaciones,productos:vProductos,proveedores:vProveedores,fichas:vFichas,rutas:vRutas,usuarios:vUsuarios};

function re(){
  if(!currentUser){return;}
  // PROTECTOR (backstop): aunque nav() ya valida, revalidamos el permiso en cada
  // render. Si S.view quedó en un módulo no permitido por cualquier vía (estado
  // heredado, cambio de rol en caliente, llamada directa), se fuerza dashboard
  // y se cierra cualquier modal abierto antes de renderizar.
  if(!canView(S.view)){S.view='dashboard';S.modal=null;}
  const meta=viewMeta[S.view]||{h:'—',s:''};
  document.getElementById('app').innerHTML=`
    ${sidebar()}
    <div class="main">
      <div class="topbar">
        <div><h1>${meta.h}</h1><div class="topbar-sub">${meta.s}</div></div>
        <div class="topbar-r"><span style="font-size:11px;color:var(--text3)">${new Date().toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</span></div>
      </div>
      <div class="content">${(viewFns[S.view]||vDashboard)()}</div>
    </div>
    ${renderModal()}`;
  document.getElementById('toasts').innerHTML=S.toasts.map(t=>`<div class="toast toast-${t.type}"><span style="color:${t.type==='ok'?'var(--green)':t.type==='err'?'var(--red)':'var(--blue)'}">${t.type==='ok'?I.check:t.type==='err'?I.alert:I.clip}</span>${t.msg}</div>`).join('');
  const dz=document.getElementById('dz');
  if(dz){dz.addEventListener('click',()=>document.getElementById('ft-file')?.click());dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');const f=e.dataTransfer.files[0];if(f){const el=document.getElementById('ft-fname');if(el){el.textContent=f.name;el.style.display='block';}toast(`"${f.name}" listo`,'info');}});}
}

// INIT
window.onload=()=>{document.getElementById('login-screen').style.display='flex';};
